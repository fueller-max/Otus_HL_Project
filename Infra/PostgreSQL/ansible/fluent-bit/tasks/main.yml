---
# tasks file for fluent-bit
- name: Install Fluent-bit
  tags: 
     - install-fluent-bit
  ansible.builtin.script: files/install.sh

- name: Create Fluent Bit state tracking directory 
  tags: 
     - install-fluent-bit
  ansible.builtin.file:
    path: /var/log/fluent-bit
    state: directory
    owner: deploy
    group: deploy
    mode: '0755'

- name: Add optimized PostgreSQL/Patroni parser block to parsers.conf
  ansible.builtin.blockinfile:
    path: /etc/fluent-bit/parsers.conf
    marker: "# {mark} ANSIBLE MANAGED POSTGRESQL PARSER"
    block: |
      [PARSER]
          Name        postgresql
          Format      regex
          Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ \w+) \[(?<pid>\d+)\] (?<level>[A-Z]{3,5}):\s+(?<message>.*)$
          Time_Key    time
          Time_Format %Y-%m-%d %H:%M:%S.%L %Z
  notify: Restart fluent-bit   

- name: Configure Fluent Bit 
  tags: 
     - install-fluent-bit
  ansible.builtin.template:
    src: fluent-bit.conf.j2
    dest: /etc/fluent-bit/fluent-bit.conf
    backup: yes
  notify: Restart fluent-bit  
