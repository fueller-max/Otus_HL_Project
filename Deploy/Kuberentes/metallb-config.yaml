apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ext-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 10.10.30.150-10.10.30.155 # actual external network range
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: prod-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
  - ext-ip-pool